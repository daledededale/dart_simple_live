name: Build SimpleLive Android手机版
on:
  workflow_dispatch: # 网页手动点按钮编译

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 配置Java17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置Flutter 3.38
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable

      - name: 编译手机端APK
        run: |
          cd simple_live_app
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: 上传arm64-v8a安装包
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-Android-arm64
          path: simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
